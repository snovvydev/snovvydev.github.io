<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="snow — programming and robots">
  <meta name="theme-color" content="#18204a">
  <title>snow</title>
  <style>
    : :root {
      --cream: #eeeaf0;
      --yellow: #ffbe24;
      --red: #f05959;
      --navy: #18204a;
      --card: #202a63;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--cream);
      background: var(--navy);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(54px, 13vh, 150px) 40px 48px;
    }

    .card {
      position: relative;
      width: min(780px, 100%);
      min-height: 650px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: visible;
      padding: 72px 92px;
      border: 1px solid rgba(255, 255, 255, .055);
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .018), transparent 55%),
        #20285a;
    }

    .eyebrow {
      margin: 0 0 28px;
      color: var(--yellow);
      font: 800 clamp(18px, 2.2vw, 24px)/1 monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--yellow);
      font-size: clamp(80px, 15vw, 124px);
      line-height: .86;
      letter-spacing: -.065em;
      font-weight: 850;
    }

    .intro {
      max-width: 620px;
      margin: 54px 0 48px;
      color: #e0e2ee;
      font-size: clamp(25px, 4.2vw, 38px);
      line-height: 1.42;
      letter-spacing: -.02em;
    }

    .links {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
    }

    .link {
      min-width: 355px;
      height: 92px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #111735;
      background: var(--yellow);
      border-radius: 999px;
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 850;
      text-decoration: none;
      transition: transform .18s ease, filter .18s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
    }

    .arrow {
      margin-left: 18px;
      font-size: 31px;
      font-weight: 600;
    }

    .orbit {
      position: absolute;
      z-index: 2;
      left: -86px;
      bottom: -75px;
      width: 700px;
      height: 510px;
      pointer-events: none;
      overflow: visible;
    }

    @media (max-width: 680px) {
      main { align-items: flex-end; padding: 96px 40px 66px; }

      .card {
        width: 100%;
        min-height: 720px;
        justify-content: flex-start;
        padding: 72px 52px 80px;
        border-radius: 30px;
      }

      .eyebrow { margin-bottom: 24px; font-size: 18px; }
      h1 { font-size: 86px; }
      .intro { margin: 38px 0 38px; font-size: 30px; line-height: 1.42; }
      .links { gap: 20px; }
      .link { min-width: 355px; height: 92px; font-size: 25px; }
      .orbit { left: -105px; bottom: -62px; width: 650px; height: 480px; }
    }

    @media (max-width: 480px) {
      main { padding: 90px 10px 45px; }
      .card { min-height: 700px; padding: 78px 52px 62px; }
      .eyebrow { font-size: 17px; }
      h1 { font-size: clamp(76px, 21vw, 88px); }
      .intro { margin: 44px 0 42px; font-size: clamp(27px, 7.7vw, 32px); }
      .link { min-width: 355px; height: 92px; }
      .orbit { left: -105px; bottom: -58px; }
    }

    @media (max-width: 420px) {
      main { padding-left: 10px; padding-right: 10px; }
      .card { min-height: 700px; padding-left: 52px; padding-right: 24px; }
      .link { min-width: 0; width: 355px; max-width: calc(100vw - 72px); }
      .orbit { width: 620px; left: -125px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-label="Introduction">
      <p class="eyebrow">HELLO, WORLD</p>
      <h1>snow</h1>
      <p class="intro">hi, im snow. i like programming, am a developer of a future project and like building robots</p>

      <div class="links">
        <a class="link" href="https://www.tiktok.com/@christmas_snwy" target="_blank" rel="noopener noreferrer">
          @christmas_snwy <span class="arrow">↗</span>
        </a>
        <a class="link" href="https://discord.com/users/1550787776616603739" target="_blank" rel="noopener noreferrer">
          Discord · @3590m <span class="arrow">↗</span>
        </a>
      </div>

      <svg class="orbit" viewBox="0 0 700 510" fill="none" aria-hidden="true">
        <path d="M 105 458 C -15 390, 5 236, 128 166 C 270 84, 436 154, 563 229 C 663 288, 652 406, 554 437 C 415 482, 287 447, 181 450 C 105 452, 57 492, 13 470" stroke="#f05959" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </section>
  </main>
</body>
</html>

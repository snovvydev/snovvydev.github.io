<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="snow — programming and robots">
  <title>snow</title>
  <style>
    :root {
      --ink: #eafcff;
      --muted: #9ab9c2;
      --ice: #72e7ff;
      --pink: #ff80bd;
      --bg: #071319;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(114, 231, 255, .12), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(255, 128, 189, .10), transparent 24rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image:
        linear-gradient(rgba(114, 231, 255, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(114, 231, 255, .08) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: 52px;
      border: 1px solid rgba(114, 231, 255, .18);
      border-radius: 28px;
      background: rgba(9, 25, 32, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--ice);
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 16vw, 112px);
      line-height: .86;
      letter-spacing: -.075em;
    }

    h1 span { color: var(--ice); }

    .intro {
      max-width: 520px;
      margin: 28px 0 36px;
      color: var(--muted);
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.55;
    }

    .intro strong { color: var(--ink); }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      color: #071319;
      background: var(--pink);
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(255, 128, 189, .24);
    }

    a::after { content: "↗"; font-size: 18px; }

    @media (max-width: 560px) {
      main { padding: 36px 28px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">hello, world</p>
    <h1><span>snow</span></h1>
    <p class="intro">I like <strong>programming</strong> and <strong>building robots</strong>. This is where I experiment, learn, and make things come to life.</p>
    <a href="https://www.tiktok.com/@christmas_snwy" target="_blank" rel="noopener noreferrer">@christmas_snwy</a>
  </main>
</body>
</html>

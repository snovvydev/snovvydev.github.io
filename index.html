<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="snow — programming and robots">
  <title>snow</title>
  <style>
    :root {
      --ink: #f4eee6;
      --muted: #c6b8a7;
      --ice: #d2c2ad;
      --pink: #b9a58c;
      --bg: #171513;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(210, 194, 173, .10), transparent 28rem),
        radial-gradient(circle at 85% 82%, rgba(103, 85, 67, .22), transparent 24rem),
        linear-gradient(135deg, #181614 0%, var(--bg) 62%, #2b211a 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(210, 194, 173, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(210, 194, 173, .07) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    main {
      position: relative;
      width: min(680px, calc(100% - 40px));
      padding: 52px;
      border: 1px solid rgba(210, 194, 173, .16);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(91, 78, 64, .88), rgba(55, 46, 38, .92));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .48);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--ice);
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 16vw, 112px);
      line-height: .86;
      letter-spacing: -.075em;
    }

    h1 span { color: var(--ice); }

    .intro {
      max-width: 520px;
      margin: 28px 0 36px;
      color: var(--muted);
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.55;
    }

    .intro strong { color: var(--ink); }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      color: #241f1a;
      background: var(--pink);
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(185, 165, 140, .22);
    }

    a::after { content: "↗"; font-size: 18px; }

    @media (max-width: 560px) {
      main { padding: 36px 28px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">hello, world</p>
    <h1><span>snow</span></h1>
    <p class="intro">hi, im snow. i like programming, am a developer of a future project and like building robots</p>
    <div class="links">
      <a href="https://www.tiktok.com/@christmas_snwy" target="_blank" rel="noopener noreferrer">@christmas_snwy</a>
      <a href="https://discord.com/users/1550787776616603739" target="_blank" rel="noopener noreferrer">Discord · @3590m</a>
    </div>
  </main>
</body>
</html>
